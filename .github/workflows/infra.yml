name: infra-validate-apply

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra*.yml'
  pull_request:
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

# Serializa los applys: infra y app comparten el state remoto
concurrency:
  group: terraform-examen-parcial-t5
  cancel-in-progress: false

env:
  TF_DIR: infra/terraform
  TF_BACKEND_RG: rg-tfstate-examen
  TF_BACKEND_SA: stexparcialt5ody01
  TF_BACKEND_CONTAINER: tfstate
  TF_BACKEND_KEY: examen-parcial-t5.tfstate
  # Auth del provider/backend azurerm via OIDC (no usa Azure CLI)
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: terraform fmt (check)
        run: terraform -chdir=${{ env.TF_DIR }} fmt -check -recursive
      - name: terraform init
        run: terraform -chdir=${{ env.TF_DIR }} init -backend=false
      - name: terraform validate
        run: terraform -chdir=${{ env.TF_DIR }} validate
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_DIR }}
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          # Skips justificados (ver comentarios en main.tf y docs/DECISIONES.md):
          # ACR Basic: 139,163,164,165,166,167,233,237 requieren SKU Premium (fuera de costo).
          # ACI publico por diseno: 98,245 (URL publica es entregable). 235: env vars no secretas.
          skip_check: CKV_AZURE_139,CKV_AZURE_163,CKV_AZURE_164,CKV_AZURE_165,CKV_AZURE_166,CKV_AZURE_167,CKV_AZURE_233,CKV_AZURE_237,CKV_AZURE_98,CKV_AZURE_245,CKV_AZURE_235
      - name: Upload Checkov evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-infra
          path: checkov.sarif

  apply:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: init/plan/apply
        run: |
          terraform -chdir=${{ env.TF_DIR }} init \
            -backend-config="resource_group_name=${{ env.TF_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ env.TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ env.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ env.TF_BACKEND_KEY }}"
          terraform -chdir=${{ env.TF_DIR }} plan -out=tfplan
          terraform -chdir=${{ env.TF_DIR }} apply -auto-approve tfplan
          terraform -chdir=${{ env.TF_DIR }} output -json | tee infra-outputs.json
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: infra/terraform/infra-outputs.json
