name: app-build-deploy-rollback

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/app*.yml'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      should_fail:
        description: 'Simular version defectuosa (SHOULD_FAIL=true) para demo de rollback'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write  # OIDC hacia Azure (federated credentials, sin secretos de larga vida)

# Serializa los applys: infra y app comparten el state remoto
concurrency:
  group: terraform-examen-parcial-t5
  cancel-in-progress: false

env:
  ACR_NAME: exparcialt5ody01
  IMAGE_NAME: app
  RG: rg-examen-parcial-t5
  ACI_NAME: aci-examen-parcial-t5
  TF_BACKEND_RG: rg-tfstate-examen
  TF_BACKEND_SA: stexparcialt5ody01
  TF_BACKEND_CONTAINER: tfstate
  TF_BACKEND_KEY: examen-parcial-t5.tfstate
  # Auth del provider/backend azurerm via OIDC (no usa Azure CLI)
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.img.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build candidate
        id: img
        run: |
          SHA=${GITHUB_SHA::12}
          echo "tag=$SHA" >> $GITHUB_OUTPUT
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:$SHA -f Dockerfile .

      - name: Trivy scan (bloquea HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.img.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Push candidate
        if: success()
        run: docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.img.outputs.tag }}

      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-candidate
          path: trivy-results.sarif

  deploy-and-verify:
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Deploy candidate + health + funcional + rollback
        env:
          CANDIDATE_TAG: ${{ needs.build-scan-push.outputs.tag }}
          FAIL_MODE: ${{ inputs.should_fail }}
        run: |
          chmod +x scripts/deploy_with_rollback.sh
          ./scripts/deploy_with_rollback.sh
